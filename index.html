<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wavemaker 原型</title>
<style>
  :root {
    --bg: #0b1420; --panel: #111d2c; --line: #223449; --text: #dfe8f1; --muted: #8aa0b6;
    --accent: #58c4ff; --accent2: #ffd166; --danger: #ff7b72;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
  header { padding: 20px 16px 8px; max-width: 1000px; margin: 0 auto; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .5px; }
  h1 small { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 10px; }
  p.lead { color: var(--muted); margin: 6px 0 0; }
  main { max-width: 1000px; margin: 0 auto; padding: 8px 16px 40px; display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 820px) { main { grid-template-columns: 1.1fr .9fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0 0 12px; }
  .row { display: grid; grid-template-columns: 110px 1fr 52px; align-items: center; gap: 10px; margin: 8px 0; }
  .row label { color: var(--text); }
  .row output { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  select, input[type=text], input[type=number] { background: #0d1826; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  button { background: #1a2b3f; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #05131f; border-color: var(--accent); font-weight: 600; }
  button.warm { background: var(--accent2); color: #2b1d00; border-color: var(--accent2); font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  .presets button { padding: 6px 10px; font-size: 13px; }
  canvas { width: 100%; height: 140px; display: block; background: #08111b; border-radius: 8px; border: 1px solid var(--line); }
  .log { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); max-height: 150px; overflow: auto; margin-top: 10px; white-space: pre-wrap; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 10px; }
  kbd { background: #0d1826; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 12px; }
  .export { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .export input[type=number] { width: 72px; }
</style>
</head>
<body>
<header>
  <h1>Wavemaker <small>程序化海浪原型 · 零采样 · 纯 Web Audio 合成</small></h1>
  <p class="lead">戴上耳机。这里没有一段录音，所有声音都是此刻算出来的，所以永远不会循环。</p>
</header>
<main>
  <section>
    <h2>这片海</h2>
    <div class="row"><label>浪高</label><input type="range" id="swell" min="0" max="1" step="0.01" value="0.6"><output for="swell">0.60</output></div>
    <div class="row"><label>周期（秒）</label><input type="range" id="period" min="4" max="20" step="0.5" value="10"><output for="period">10</output></div>
    <div class="row"><label>拍岸力度</label><input type="range" id="breakForce" min="0" max="1" step="0.01" value="0.6"><output for="breakForce">0.60</output></div>
    <div class="row"><label>冲滩</label><input type="range" id="wash" min="0" max="1" step="0.01" value="0.6"><output for="wash">0.60</output></div>
    <div class="row"><label>距离</label><input type="range" id="distance" min="0" max="1" step="0.01" value="0.25"><output for="distance">0.25</output></div>
    <div class="row"><label>风</label><input type="range" id="wind" min="0" max="1" step="0.01" value="0.25"><output for="wind">0.25</output></div>
    <div class="row"><label>海鸥</label><input type="range" id="gulls" min="0" max="1" step="0.01" value="0.3"><output for="gulls">0.30</output></div>
    <div class="row"><label>材质</label>
      <select id="material">
        <option value="sand">沙滩</option>
        <option value="pebble">卵石滩</option>
        <option value="rock">礁石</option>
      </select><span></span></div>
    <div class="row"><label>种子</label><input type="text" id="seed" value="osaka"><span></span></div>

    <h2 style="margin-top:16px">预设</h2>
    <div class="buttons presets">
      <button data-preset="dawn">清晨平静</button>
      <button data-preset="afternoon">午后沙滩</button>
      <button data-preset="brighton">卵石滩</button>
      <button data-preset="storm">礁石风暴</button>
      <button data-preset="far">远处的海</button>
    </div>

    <div class="buttons">
      <button class="primary" id="toggle">开始</button>
      <button class="warm" id="tap">拍一浪</button>
      <button id="gull">叫一声海鸥</button>
    </div>
    <p class="hint">快捷键：<kbd>空格</kbd> 拍一浪 · <kbd>G</kbd> 海鸥。换种子需要重新开始。</p>
  </section>

  <section>
    <h2>正在发生</h2>
    <canvas id="scope" width="900" height="280"></canvas>
    <div class="log" id="log"></div>

    <h2 style="margin-top:16px">导出</h2>
    <div class="export">
      <label>时长</label><input type="number" id="seconds" min="3" max="600" value="30"><span>秒</span>
      <button id="export">导出 WAV（离线渲染）</button>
    </div>
    <p class="hint">导出用同一个引擎和同一个种子离线渲染，得到的就是"这片海"的一段。48 kHz、16 bit、立体声，直接丢进剪映或 Premiere。</p>
  </section>
</main>

<script>
// ---------- 参数 ----------
const P = { swell: .6, period: 10, breakForce: .6, wash: .6, distance: .25, wind: .25, gulls: .3, material: 'sand', seed: 'osaka' };

const PRESETS = {
  dawn:      { swell: .3, period: 12, breakForce: .35, wash: .5, distance: .3, wind: .1, gulls: .15, material: 'sand' },
  afternoon: { swell: .6, period: 9,  breakForce: .6,  wash: .65, distance: .2, wind: .25, gulls: .4, material: 'sand' },
  brighton:  { swell: .55, period: 8, breakForce: .7,  wash: .7, distance: .15, wind: .35, gulls: .3, material: 'pebble' },
  storm:     { swell: .95, period: 6, breakForce: .95, wash: .5, distance: .1, wind: .8, gulls: .05, material: 'rock' },
  far:       { swell: .7, period: 11, breakForce: .5,  wash: .3, distance: .85, wind: .3, gulls: .2, material: 'sand' },
};

// 材质决定每一层的滤波器落点。这是"这片海是哪片海"的主要来源。
const MATERIAL = {
  sand:   { swellLP: 700, breakBP: 1400, washHP: 1500, washLP: 7000, foam: 1.0, rattle: 0,   thump: 0 },
  pebble: { swellLP: 600, breakBP: 1900, washHP: 2200, washLP: 9000, foam: 0.6, rattle: 0.6, thump: 0.15 },
  rock:   { swellLP: 500, breakBP: 1100, washHP: 1200, washLP: 5000, foam: 0.8, rattle: 0,   thump: 0.7 },
};

// ---------- 可复现的随机 ----------
function hashSeed(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  return (h >>> 0) || 1;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- 引擎 ----------
function noiseSource(ctx, rng, seconds = 5) {
  const len = Math.floor(ctx.sampleRate * seconds);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = rng() * 2 - 1;
  const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true;
  return s;
}

// 一层 = 独立噪声源 -> 若干滤波器 -> 增益 -> 声像
function layer(ctx, rng, dest, filters, pan = 0) {
  const src = noiseSource(ctx, rng);
  const gain = ctx.createGain(); gain.gain.value = 0;
  const panner = ctx.createStereoPanner(); panner.pan.value = pan;
  let node = src;
  const fs = filters.map(f => {
    const b = ctx.createBiquadFilter(); b.type = f.type; b.frequency.value = f.freq; b.Q.value = f.Q ?? 0.7;
    node.connect(b); node = b; return b;
  });
  node.connect(gain).connect(panner).connect(dest);
  src.start(0);
  return { src, gain: gain.gain, panner, filters: fs };   // gain 直接暴露 AudioParam
}

function distanceCutoff(d) { return 12000 * Math.pow(0.08, d); }

function buildScene(ctx, p, onEvent) {
  const rng = mulberry32(hashSeed(p.seed));
  const master = ctx.createGain(); master.gain.value = 0.9;
  const tone = ctx.createBiquadFilter(); tone.type = 'lowpass'; tone.Q.value = 0.5; tone.frequency.value = distanceCutoff(p.distance);
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 18; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.4;
  const analyser = ctx.createAnalyser(); analyser.fftSize = 1024;
  master.connect(tone).connect(comp).connect(analyser).connect(ctx.destination);

  const L = {
    bedL:   layer(ctx, rng, master, [{ type: 'lowpass', freq: 260 }], -0.75),
    bedR:   layer(ctx, rng, master, [{ type: 'lowpass', freq: 260 }],  0.75),
    swell:  layer(ctx, rng, master, [{ type: 'lowpass', freq: 700 }, { type: 'highpass', freq: 60 }]),
    brk:    layer(ctx, rng, master, [{ type: 'bandpass', freq: 1400, Q: 0.6 }]),
    wash:   layer(ctx, rng, master, [{ type: 'highpass', freq: 1500 }, { type: 'lowpass', freq: 7000 }]),
    foam:   layer(ctx, rng, master, [{ type: 'highpass', freq: 6500 }]),
    rattle: layer(ctx, rng, master, [{ type: 'bandpass', freq: 3200, Q: 2.5 }]),
    thump:  layer(ctx, rng, master, [{ type: 'lowpass', freq: 110 }]),
    wind:   layer(ctx, rng, master, [{ type: 'bandpass', freq: 420, Q: 1.8 }]),
  };

  const S = { nextWave: 0.5, waveIndex: 0, dir: 1, nextGull: 2 + rng() * 6, nextBed: 0, nextWind: 0, until: 0 };

  function wave(t, strength, dir) {
    const m = MATERIAL[p.material];
    const s = Math.min(1, Math.max(0.05, strength));
    const near = 1 - 0.7 * p.distance;              // 近场层随距离衰减
    const rise = p.period * 0.32 * (0.8 + 0.4 * rng());
    const tB = t + rise;                            // 拍岸时刻

    // 涌：低通噪声慢慢涨起来，滤波器随之打开
    L.swell.gain.setTargetAtTime(0.10 + 0.55 * s, t, rise / 2.5);
    L.swell.gain.setTargetAtTime(0.04, tB + 0.2, 0.9);
    L.swell.filters[0].frequency.setTargetAtTime(m.swellLP * (0.6 + 0.8 * s), t, rise / 2);
    L.swell.filters[0].frequency.setTargetAtTime(m.swellLP * 0.6, tB + 0.5, 1.5);

    // 拍岸：带通噪声的一次爆发，越大的浪起得越快、拖得越长
    const bf = p.breakForce * (0.5 + 0.6 * s) * near;
    L.brk.filters[0].frequency.setValueAtTime(m.breakBP * (0.85 + 0.3 * rng()), tB);
    L.brk.gain.setTargetAtTime(bf * 0.9, tB, 0.06 + 0.25 * (1 - bf));
    L.brk.gain.setTargetAtTime(0, tB + 0.35 + 0.4 * bf, 0.5 + 0.9 * s);
    L.brk.panner.pan.setValueAtTime(dir * 0.5, tB);

    // 礁石：低频的一声闷响
    if (m.thump) {
      L.thump.gain.setTargetAtTime(m.thump * bf, tB, 0.04);
      L.thump.gain.setTargetAtTime(0, tB + 0.15, 0.35);
    }

    // 冲滩：高频嘶声沿着海岸线跑；水变薄时音色变亮，回退时变暗
    const w = p.wash * (0.45 + 0.7 * s) * near;
    const tW = tB + 0.25;
    const runup = 1.2 + 2.2 * w;
    L.wash.filters[1].frequency.setValueAtTime(m.washLP, tW);
    L.wash.gain.setTargetAtTime(0.7 * w, tW, 0.35);
    L.wash.gain.setTargetAtTime(0, tW + runup, 0.9 + 1.6 * w);
    L.wash.filters[0].frequency.setValueAtTime(m.washHP * 0.6, tW);
    L.wash.filters[0].frequency.linearRampToValueAtTime(m.washHP * 1.6, tW + runup);
    L.wash.filters[0].frequency.setTargetAtTime(m.washHP * 0.5, tW + runup, 1.5);
    L.wash.panner.pan.setValueAtTime(-dir * 0.6, tW);
    L.wash.panner.pan.linearRampToValueAtTime(dir * 0.6, tW + runup + 2);

    // 泡沫：冲滩之后留在沙上的细碎嘶声
    L.foam.gain.setTargetAtTime(0.22 * w * m.foam, tW + 0.3, 0.6);
    L.foam.gain.setTargetAtTime(0, tW + runup + 0.5, 2.5);

    // 卵石：回退时成百上千颗石头滚动，用一串短促的噪声脉冲模拟
    if (m.rattle) {
      const t0 = tW + runup * 0.5, span = runup + 2;
      const n = Math.floor(30 + 90 * w);
      const times = [];
      for (let i = 0; i < n; i++) times.push(t0 + rng() * span);
      times.sort((a, b) => a - b);
      L.rattle.panner.pan.setValueAtTime(dir * 0.4, t0);
      for (const tt of times) {
        L.rattle.gain.setValueAtTime(m.rattle * w * (0.3 + rng()), tt);
        L.rattle.gain.setTargetAtTime(0, tt + 0.01, 0.012);
      }
    }

    onEvent && onEvent({ kind: 'wave', at: tB, strength: s, dir });
  }

  function gull(t) {
    const near = 1 - 0.6 * p.distance;
    const dist = 0.25 + rng() * 0.75;                 // 这只鸟有多远
    const f0 = 900 + rng() * 500;
    const osc = ctx.createOscillator(); osc.type = 'sawtooth';
    const vib = ctx.createOscillator(); vib.frequency.value = 22 + rng() * 8;
    const vibGain = ctx.createGain(); vibGain.gain.value = f0 * 0.02;
    vib.connect(vibGain).connect(osc.frequency);
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2.5;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 9000 * (1 - dist * 0.7);
    const g = ctx.createGain(); g.gain.value = 0;
    const pan = ctx.createStereoPanner(); pan.pan.value = rng() * 1.6 - 0.8;
    osc.connect(bp).connect(lp).connect(g).connect(pan).connect(master);
    const calls = 1 + Math.floor(rng() * 3);
    let tt = t;
    const amp = 0.18 * (1 - dist * 0.75) * near;
    for (let i = 0; i < calls; i++) {
      const dur = 0.35 + rng() * 0.3;
      osc.frequency.setValueAtTime(f0 * 0.85, tt);
      osc.frequency.linearRampToValueAtTime(f0 * 1.15, tt + dur * 0.3);
      osc.frequency.linearRampToValueAtTime(f0 * 0.7, tt + dur);
      bp.frequency.setValueAtTime(f0 * 1.9, tt);
      bp.frequency.linearRampToValueAtTime(f0 * 2.4, tt + dur * 0.3);
      bp.frequency.linearRampToValueAtTime(f0 * 1.5, tt + dur);
      g.gain.setValueAtTime(0, tt);
      g.gain.linearRampToValueAtTime(amp, tt + 0.04);
      g.gain.setValueAtTime(amp, tt + dur * 0.6);
      g.gain.linearRampToValueAtTime(0, tt + dur);
      tt += dur + 0.12 + rng() * 0.25;
    }
    osc.start(t); vib.start(t); osc.stop(tt + 0.1); vib.stop(tt + 0.1);
    onEvent && onEvent({ kind: 'gull', at: t, dist });
  }

  // 把 [from, to) 这段时间里该发生的事都排进去。实时模式每 300 ms 往前排 2.5 s，离线模式一次排完。
  function schedule(from, to) {
    while (S.nextWave < to) {
      const group = 0.7 + 0.3 * Math.sin(S.waveIndex * Math.PI * 2 / 7 + 0.4);   // 七浪一组
      const strength = p.swell * (0.55 + 0.9 * rng()) * group;
      S.dir = -S.dir;
      wave(S.nextWave, strength, S.dir);
      S.waveIndex++;
      S.nextWave += p.period * (0.75 + 0.5 * rng());
    }
    while (S.nextGull < to) {
      if (p.gulls > 0.01 && rng() < p.gulls) gull(S.nextGull);
      S.nextGull += 3 + rng() * 10 * (1.2 - p.gulls);
    }
    // 远涌床：一直在，慢慢起伏
    while (S.nextBed < to) {
      const base = (0.05 + 0.16 * p.swell) * (1 - 0.35 * p.distance);
      L.bedL.gain.setTargetAtTime(base * (0.7 + 0.6 * rng()), S.nextBed, 1.5);
      L.bedR.gain.setTargetAtTime(base * (0.7 + 0.6 * rng()), S.nextBed + 0.7, 1.5);
      S.nextBed += 2.5 + rng() * 2;
    }
    // 风：阵性的，频率和强度都在飘
    while (S.nextWind < to) {
      const gust = p.wind * (0.4 + rng() * 0.9);
      L.wind.gain.setTargetAtTime(0.16 * gust, S.nextWind, 1.2 + rng() * 2);
      L.wind.filters[0].frequency.setTargetAtTime(300 + 400 * gust + rng() * 200, S.nextWind, 1.5);
      S.nextWind += 1.5 + rng() * 4;
    }
    tone.frequency.setTargetAtTime(distanceCutoff(p.distance), from, 0.3);
  }

  return { ctx, master, analyser, schedule, wave, gull, rng, state: S };
}

// ---------- WAV 编码 ----------
function encodeWav(buffer) {
  const ch = buffer.numberOfChannels, len = buffer.length, sr = buffer.sampleRate;
  const out = new ArrayBuffer(44 + len * ch * 2);
  const v = new DataView(out);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + len * ch * 2, true); str(8, 'WAVE');
  str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, ch, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * ch * 2, true); v.setUint16(32, ch * 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, len * ch * 2, true);
  const chans = []; for (let c = 0; c < ch; c++) chans.push(buffer.getChannelData(c));
  let o = 44;
  for (let i = 0; i < len; i++) for (let c = 0; c < ch; c++) {
    const x = Math.max(-1, Math.min(1, chans[c][i]));
    v.setInt16(o, x < 0 ? x * 32768 : x * 32767, true); o += 2;
  }
  return new Blob([out], { type: 'audio/wav' });
}

async function renderOffline(p, seconds, sampleRate = 48000) {
  const off = new OfflineAudioContext(2, Math.floor(sampleRate * seconds), sampleRate);
  const scene = buildScene(off, p, null);
  scene.schedule(0, seconds);
  return off.startRendering();
}

// ---------- 界面 ----------
const $ = s => document.querySelector(s);
const logEl = $('#log');
function log(msg) {
  const lines = logEl.textContent.split('\n').filter(Boolean);
  lines.unshift(msg);
  logEl.textContent = lines.slice(0, 8).join('\n');
}

for (const id of ['swell', 'period', 'breakForce', 'wash', 'distance', 'wind', 'gulls']) {
  const el = $('#' + id), out = document.querySelector(`output[for=${id}]`);
  const show = () => out.textContent = id === 'period' ? Number(el.value).toFixed(1) : Number(el.value).toFixed(2);
  el.addEventListener('input', () => { P[id] = Number(el.value); show(); });
  show();
}
$('#material').addEventListener('change', e => { P.material = e.target.value; log(`材质 → ${e.target.selectedOptions[0].textContent}，下一浪生效`); });
$('#seed').addEventListener('change', e => { P.seed = e.target.value || 'sea'; log('种子已改，重新开始后生效'); });

function applyPreset(name) {
  const pr = PRESETS[name];
  Object.assign(P, pr);
  for (const k of Object.keys(pr)) {
    const el = $('#' + k); if (!el) continue;
    el.value = pr[k];
    el.dispatchEvent(new Event(k === 'material' ? 'change' : 'input'));
  }
  log(`预设：${name}`);
}
document.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => applyPreset(b.dataset.preset)));

let live = null, timer = null, raf = null;

function onEvent(ev) {
  const delay = live ? (ev.at - live.ctx.currentTime).toFixed(1) : '?';
  if (ev.kind === 'wave') log(`浪 #${live.state.waveIndex + 1}  强度 ${ev.strength.toFixed(2)}  ${ev.dir > 0 ? '左→右' : '右→左'}  ${delay}s 后拍岸`);
  else log(`海鸥  距离 ${ev.dist.toFixed(2)}`);
}

async function start() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();
  live = buildScene(ctx, P, onEvent);
  live.state.until = ctx.currentTime + 0.05;
  timer = setInterval(() => {
    const to = ctx.currentTime + 2.5;
    if (to > live.state.until) { live.schedule(live.state.until, to); live.state.until = to; }
  }, 300);
  $('#toggle').textContent = '停止';
  log(`开始：种子 "${P.seed}"`);
  draw();
}
function stop() {
  clearInterval(timer); cancelAnimationFrame(raf);
  live.master.gain.setTargetAtTime(0, live.ctx.currentTime, 0.3);
  const c = live.ctx; setTimeout(() => c.close(), 1200);
  live = null;
  $('#toggle').textContent = '开始';
  log('停止');
}
$('#toggle').addEventListener('click', () => live ? stop() : start());
$('#tap').addEventListener('click', tapWave);
$('#gull').addEventListener('click', tapGull);
function tapWave() {
  if (!live) return;
  const t = live.ctx.currentTime + 0.02;
  live.state.dir = -live.state.dir;
  live.wave(t, Math.max(0.4, P.swell), live.state.dir);
  live.state.waveIndex++;
  live.state.nextWave = Math.max(live.state.nextWave, t + P.period * 0.6);
}
function tapGull() { if (live) live.gull(live.ctx.currentTime + 0.02); }
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); tapWave(); }
  if (e.key === 'g' || e.key === 'G') tapGull();
});

// 示波器：把此刻的波形画出来，顺便当作"海平面"
const canvas = $('#scope'), g2d = canvas.getContext('2d');
const scopeBuf = new Uint8Array(1024);
function draw() {
  if (!live) return;
  live.analyser.getByteTimeDomainData(scopeBuf);
  const W = canvas.width, H = canvas.height;
  g2d.fillStyle = '#08111b'; g2d.fillRect(0, 0, W, H);
  g2d.strokeStyle = '#58c4ff'; g2d.lineWidth = 2; g2d.beginPath();
  for (let i = 0; i < scopeBuf.length; i++) {
    const x = i / scopeBuf.length * W, y = (scopeBuf[i] / 255) * H;
    i ? g2d.lineTo(x, y) : g2d.moveTo(x, y);
  }
  g2d.stroke();
  raf = requestAnimationFrame(draw);
}

$('#export').addEventListener('click', async () => {
  const btn = $('#export'), seconds = Math.min(600, Math.max(3, Number($('#seconds').value) || 30));
  btn.disabled = true; btn.textContent = `渲染 ${seconds}s…`;
  try {
    const buf = await renderOffline({ ...P }, seconds);
    const url = URL.createObjectURL(encodeWav(buf));
    const a = document.createElement('a');
    a.href = url; a.download = `wavemaker-${P.material}-${P.seed}-${seconds}s.wav`; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    log(`已导出 ${seconds}s WAV`);
  } catch (e) {
    log('导出失败：' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = '导出 WAV（离线渲染）';
  }
});

window.Wavemaker = { P, buildScene, renderOffline, encodeWav, MATERIAL, PRESETS };
</script>
</body>
