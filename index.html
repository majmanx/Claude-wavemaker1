<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wavemaker 原型</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Wavemaker <small>程序化海浪原型 · 零采样 · 纯 Web Audio 合成</small></h1>
  <p class="lead">戴上耳机。这里没有一段录音，所有声音都是此刻算出来的，所以永远不会循环。</p>
  <nav><a class="current" href="index.html">海浪</a><a href="sparkler.html">仙女棒</a><a href="dandelion.html">蒲公英</a><a href="analyze.html">分析</a></nav>
</header>
<main>
  <section>
    <h2>这片海</h2>
    <div class="row"><label>浪高</label><input type="range" id="swell" min="0" max="1" step="0.01" value="0.6"><output for="swell">0.60</output></div>
    <div class="row"><label>周期（秒）</label><input type="range" id="period" min="4" max="20" step="0.5" value="9"><output for="period">9</output></div>
    <div class="row"><label>拍岸力度</label><input type="range" id="breakForce" min="0" max="1" step="0.01" value="0.6"><output for="breakForce">0.60</output></div>
    <div class="row"><label>冲滩</label><input type="range" id="wash" min="0" max="1" step="0.01" value="0.6"><output for="wash">0.60</output></div>
    <div class="row"><label>距离</label><input type="range" id="distance" min="0" max="1" step="0.01" value="0.25"><output for="distance">0.25</output></div>
    <div class="row"><label>风</label><input type="range" id="wind" min="0" max="1" step="0.01" value="0.25"><output for="wind">0.25</output></div>
    <div class="row"><label>海鸥</label><input type="range" id="gulls" min="0" max="1" step="0.01" value="0.3"><output for="gulls">0.30</output></div>
    <div class="row"><label>材质</label>
      <select id="material">
        <option value="sand">沙滩</option>
        <option value="pebble">卵石滩</option>
        <option value="rock">礁石</option>
      </select><span></span></div>
    <div class="row"><label>种子</label><input type="text" id="seed" value="osaka"><span></span></div>

    <h2 style="margin-top:16px">预设</h2>
    <div class="buttons presets">
      <button data-preset="dawn">清晨平静</button>
      <button data-preset="afternoon">午后沙滩</button>
      <button data-preset="brighton">卵石滩</button>
      <button data-preset="storm">礁石风暴</button>
      <button data-preset="far">远处的海</button>
    </div>

    <div class="buttons">
      <button class="primary" id="toggle">开始</button>
      <button class="warm" id="tap">拍一浪</button>
      <button id="gull">叫一声海鸥</button>
    </div>
    <p class="hint">快捷键：<kbd>空格</kbd> 拍一浪 · <kbd>G</kbd> 海鸥。换种子需要重新开始。</p>
  </section>

  <section>
    <h2>正在发生</h2>
    <canvas id="scope" width="900" height="280"></canvas>
    <div class="log" id="log"></div>

    <h2 style="margin-top:16px">导出</h2>
    <div class="export">
      <label>时长</label><input type="number" id="seconds" min="3" max="600" value="30"><span>秒</span>
      <button id="export">导出 WAV（离线渲染）</button>
    </div>
    <p class="hint">导出用同一个引擎和同一个种子离线渲染，得到的就是"这片海"的一段。48 kHz、16 bit、立体声，直接丢进剪映或 Premiere。</p>
  </section>
</main>

<script src="ocean.js"></script>
<script>
// ---------- 参数 ----------
const P = { swell: .6, period: 9, breakForce: .6, wash: .6, distance: .25, wind: .25, gulls: .3, material: 'sand', seed: 'osaka' };
const { PRESETS, renderOffline, encodeWav } = window.Wavemaker;
const buildScene = window.Wavemaker.buildScene;

// ---------- 界面 ----------
const $ = s => document.querySelector(s);
const logEl = $('#log');
function log(msg) {
  const lines = logEl.textContent.split('\n').filter(Boolean);
  lines.unshift(msg);
  logEl.textContent = lines.slice(0, 8).join('\n');
}

for (const id of ['swell', 'period', 'breakForce', 'wash', 'distance', 'wind', 'gulls']) {
  const el = $('#' + id), out = document.querySelector(`output[for=${id}]`);
  const show = () => out.textContent = id === 'period' ? Number(el.value).toFixed(1) : Number(el.value).toFixed(2);
  el.addEventListener('input', () => { P[id] = Number(el.value); show(); });
  show();
}
$('#material').addEventListener('change', e => { P.material = e.target.value; log(`材质 → ${e.target.selectedOptions[0].textContent}，下一浪生效`); });
$('#seed').addEventListener('change', e => { P.seed = e.target.value || 'sea'; log('种子已改，重新开始后生效'); });

function applyPreset(name) {
  const pr = PRESETS[name];
  Object.assign(P, pr);
  for (const k of Object.keys(pr)) {
    const el = $('#' + k); if (!el) continue;
    el.value = pr[k];
    el.dispatchEvent(new Event(k === 'material' ? 'change' : 'input'));
  }
  log(`预设：${name}`);
}
document.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => applyPreset(b.dataset.preset)));

let live = null, timer = null, raf = null;

function onEvent(ev) {
  const delay = live ? (ev.at - live.ctx.currentTime).toFixed(1) : '?';
  if (ev.kind === 'wave') log(`浪 #${live.state.waveIndex + 1}  强度 ${ev.strength.toFixed(2)}  ${ev.dir > 0 ? '左→右' : '右→左'}  ${delay}s 后拍岸`);
  else log(`海鸥  距离 ${ev.dist.toFixed(2)}`);
}

async function start() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();
  live = buildScene(ctx, P, onEvent);
  live.state.until = ctx.currentTime + 0.05;
  timer = setInterval(() => {
    const to = ctx.currentTime + 2.5;
    if (to > live.state.until) { live.schedule(live.state.until, to); live.state.until = to; }
  }, 300);
  $('#toggle').textContent = '停止';
  log(`开始：种子 "${P.seed}"`);
  draw();
}
function stop() {
  clearInterval(timer); cancelAnimationFrame(raf);
  live.master.gain.setTargetAtTime(0, live.ctx.currentTime, 0.3);
  const c = live.ctx; setTimeout(() => c.close(), 1200);
  live = null;
  $('#toggle').textContent = '开始';
  log('停止');
}
$('#toggle').addEventListener('click', () => live ? stop() : start());
$('#tap').addEventListener('click', tapWave);
$('#gull').addEventListener('click', tapGull);
function tapWave() {
  if (!live) return;
  const t = live.ctx.currentTime + 0.02;
  live.state.dir = -live.state.dir;
  live.wave(t, Math.max(0.4, P.swell), live.state.dir);
  live.state.waveIndex++;
  live.state.nextWave = Math.max(live.state.nextWave, t + P.period * 0.6);
}
function tapGull() { if (live) live.gull(live.ctx.currentTime + 0.02); }
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); tapWave(); }
  if (e.key === 'g' || e.key === 'G') tapGull();
});

// 示波器：把此刻的波形画出来，顺便当作"海平面"
const canvas = $('#scope'), g2d = canvas.getContext('2d');
const scopeBuf = new Uint8Array(1024);
function draw() {
  if (!live) return;
  live.analyser.getByteTimeDomainData(scopeBuf);
  const W = canvas.width, H = canvas.height;
  g2d.fillStyle = '#08111b'; g2d.fillRect(0, 0, W, H);
  g2d.strokeStyle = '#58c4ff'; g2d.lineWidth = 2; g2d.beginPath();
  for (let i = 0; i < scopeBuf.length; i++) {
    const x = i / scopeBuf.length * W, y = (scopeBuf[i] / 255) * H;
    i ? g2d.lineTo(x, y) : g2d.moveTo(x, y);
  }
  g2d.stroke();
  raf = requestAnimationFrame(draw);
}

$('#export').addEventListener('click', async () => {
  const btn = $('#export'), seconds = Math.min(600, Math.max(3, Number($('#seconds').value) || 30));
  btn.disabled = true; btn.textContent = `渲染 ${seconds}s…`;
  try {
    const buf = await renderOffline({ ...P }, seconds);
    const url = URL.createObjectURL(encodeWav(buf));
    const a = document.createElement('a');
    a.href = url; a.download = `wavemaker-${P.material}-${P.seed}-${seconds}s.wav`; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    log(`已导出 ${seconds}s WAV`);
  } catch (e) {
    log('导出失败：' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = '导出 WAV（离线渲染）';
  }
});

window.Wavemaker.P = P;
</script>
</body>
</html>
