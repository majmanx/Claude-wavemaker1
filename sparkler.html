<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wavemaker · 仙女棒</title>
<link rel="stylesheet" href="style.css">
<style>
  canvas#sky { height: 300px; }
</style>
</head>
<body>
<header>
  <h1>仙女棒 <small>火花是一个随机过程 · 零采样</small></h1>
  <p class="lead">点一根，它会烧一阵，然后噼里啪啦地熄掉。密度、律动、力度、深浅都在你手里。</p>
  <nav><a href="index.html">海浪</a><a class="current" href="sparkler.html">仙女棒</a><a href="dandelion.html">蒲公英</a></nav>
</header>
<main>
  <section>
    <h2>这根仙女棒</h2>
    <div class="row"><label>密度</label><input type="range" id="density" min="0" max="1" step="0.01" value="0.6"><output for="density">0.60</output></div>
    <div class="row"><label>律动</label><input type="range" id="burstiness" min="0" max="1" step="0.01" value="0.5"><output for="burstiness">0.50</output></div>
    <div class="row"><label>力度</label><input type="range" id="force" min="0" max="1" step="0.01" value="0.6"><output for="force">0.60</output></div>
    <div class="row"><label>深浅</label><input type="range" id="depth" min="0" max="1" step="0.01" value="0.4"><output for="depth">0.40</output></div>
    <div class="row"><label>燃烧（秒）</label><input type="range" id="burn" min="8" max="90" step="1" value="35"><output for="burn">35</output></div>
    <div class="row"><label>种子</label><input type="text" id="seed" value="chunjie"><span></span></div>
    <p class="hint">律动 = 火花有多"抱团"。0 是均匀的沙沙声，1 是一阵一阵、带不规则附点的噼啪。快熄灭时律动会自己变强，就像真的仙女棒。</p>
    <div class="buttons">
      <button class="primary" id="toggle">开始</button>
      <button class="warm" id="light">点一根</button>
      <button id="out">全灭</button>
    </div>
    <p class="hint">快捷键：<kbd>空格</kbd> 点一根。可以同时点好几根。</p>
  </section>
  <section>
    <h2>夜空</h2>
    <canvas id="sky" width="900" height="600"></canvas>
    <div class="log" id="log"></div>
    <h2 style="margin-top:16px">导出</h2>
    <div class="export">
      <label>几根</label><input type="number" id="count" min="1" max="6" value="1">
      <button id="export">导出 WAV（一根烧完的全过程）</button>
    </div>
    <p class="hint">离线渲染，时长 = 燃烧时长 + 3 秒尾巴。多根会错开点燃。</p>
  </section>
</main>

<script>
const P = { density: .6, burstiness: .5, force: .6, depth: .4, burn: 35, seed: 'chunjie' };

function hashSeed(str) { let h = 1779033703 ^ str.length; for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); } return (h >>> 0) || 1; }
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

function noiseSource(ctx, rng, seconds = 3) {
  const len = Math.floor(ctx.sampleRate * seconds);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = rng() * 2 - 1;
  const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.start(0);
  return s;
}
function voice(ctx, rng, dest, type, freq, Q) {
  const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = Q;
  const g = ctx.createGain(); g.gain.value = 0;
  const pan = ctx.createStereoPanner();
  noiseSource(ctx, rng).connect(f).connect(g).connect(pan).connect(dest);
  return { f, gain: g.gain, pan: pan.pan };
}

// 一根仙女棒的亮度曲线：点燃很快，中段微微起伏，最后 20% 越来越弱、越来越断续
function intensity(sp, t) {
  const u = (t - sp.t0) / sp.dur;
  if (u < 0) return 0;
  if (u < 0.02) return u / 0.02;
  if (u < 0.8) return 0.82 + 0.18 * Math.sin(t * 1.3 + sp.phase) * Math.sin(t * 0.37 + sp.phase * 2);
  if (u < 1) { const tail = (1 - u) / 0.2; return Math.pow(tail, 1.4) * 0.9; }
  return 0;
}

function buildScene(ctx, p, onSpark) {
  const rng = mulberry32(hashSeed(p.seed));
  const master = ctx.createGain(); master.gain.value = 0.9;
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 3; comp.attack.value = 0.002; comp.release.value = 0.25;
  const analyser = ctx.createAnalyser(); analyser.fftSize = 1024;
  master.connect(comp).connect(analyser).connect(ctx.destination);

  const N = 8;
  const sparks = []; for (let i = 0; i < N; i++) sparks.push(voice(ctx, rng, master, 'bandpass', 5000, 3));
  const pops = voice(ctx, rng, master, 'bandpass', 1400, 1.2);
  const hiss = voice(ctx, rng, master, 'highpass', 5000, 0.7);
  const ignite = voice(ctx, rng, master, 'bandpass', 600, 1.5);
  let vi = 0;
  const S = { sparklers: [], until: 0 };

  function light(t0, pan) {
    const sp = { t0, dur: p.burn * (0.9 + 0.2 * rng()), phase: rng() * 6.28, pan: pan ?? (rng() * 1.2 - 0.6), next: t0, segEnd: t0, mul: 1, id: S.sparklers.length + 1 };
    S.sparklers.push(sp);
    // 点燃：一声短促的"呲"，滤波器往上扫
    ignite.f.frequency.setValueAtTime(400, t0);
    ignite.f.frequency.exponentialRampToValueAtTime(3500, t0 + 0.35);
    ignite.gain.setValueAtTime(0, t0);
    ignite.gain.linearRampToValueAtTime(0.35 * p.force, t0 + 0.05);
    ignite.gain.setTargetAtTime(0, t0 + 0.2, 0.15);
    ignite.pan.setValueAtTime(sp.pan, t0);
    return sp;
  }

  function spark(sp, t, I) {
    const v = sparks[vi++ % N];
    const center = (9000 - 6000 * p.depth) * (0.6 + 0.8 * rng());
    const r = rng();
    const amp = p.force * (0.12 + 0.88 * r * r) * (0.5 + 0.5 * I) * 0.6;
    const decay = 0.004 + 0.025 * rng() + (r > 0.92 ? 0.05 : 0);
    v.f.frequency.setValueAtTime(center, t);
    v.pan.setValueAtTime(sp.pan + (rng() - 0.5) * 0.35, t);
    v.gain.setValueAtTime(amp, t);
    v.gain.setTargetAtTime(0, t + 0.003, decay);
    if (rng() < 0.025 * p.force * (0.5 + 0.5 * I)) {        // 偶尔一个大的"啪"
      pops.f.frequency.setValueAtTime(800 + 1400 * rng(), t);
      pops.pan.setValueAtTime(sp.pan, t);
      pops.gain.setValueAtTime(0.5 * p.force, t);
      pops.gain.setTargetAtTime(0, t + 0.005, 0.03 + 0.07 * rng());
    }
    onSpark && onSpark({ at: t, sp, amp, big: r > 0.92 });
  }

  // 火花 = 强度随时间变化的泊松过程；"律动"把强度切成一段一段随机的倍率，就有了抱团和附点
  function scheduleSparkler(sp, to) {
    const end = sp.t0 + sp.dur;
    while (sp.next < to && sp.next < end) {
      const t = sp.next;
      const I = intensity(sp, t);
      const u = (t - sp.t0) / sp.dur;
      const burst = Math.min(1, p.burstiness + (u > 0.8 ? (1 - I) * 0.7 : 0));
      if (t >= sp.segEnd) {
        sp.segEnd = t + 0.04 + rng() * (0.12 + 0.35 * burst);
        const r = rng();
        sp.mul = r < burst ? [0.03, 0.25, 1.8, 3.2][Math.floor(rng() * 4)] : 1;
        sp.segEnd += (sp.mul < 0.1 ? 0.15 * burst * rng() : 0);     // 空拍拉长一点，附点感
      }
      const lambda = Math.max(0.8, (12 + 340 * p.density) * I * sp.mul);
      if (I > 0.005 && rng() < Math.min(1, I * 1.5)) spark(sp, t, I);
      sp.next = t + (-Math.log(1 - rng()) / lambda);
    }
    if (sp.next >= end && !sp.done) { sp.done = true; }
  }

  function schedule(from, to) {
    from = Math.max(0, from);
    for (const sp of S.sparklers) scheduleSparkler(sp, to);
    // 底噪：所有活着的仙女棒的亮度之和
    for (let t = from; t < to; t += 0.25) {
      let sum = 0; for (const sp of S.sparklers) sum += intensity(sp, t);
      hiss.gain.setTargetAtTime(0.03 * p.force * Math.min(2, sum), t, 0.15);
    }
    S.sparklers = S.sparklers.filter(sp => to < sp.t0 + sp.dur + 1);
  }

  return { ctx, master, analyser, light, schedule, scheduleSparkler, state: S, rng };
}

function encodeWav(buffer) {
  const ch = buffer.numberOfChannels, len = buffer.length, sr = buffer.sampleRate;
  const out = new ArrayBuffer(44 + len * ch * 2), v = new DataView(out);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + len * ch * 2, true); str(8, 'WAVE'); str(12, 'fmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, ch, true); v.setUint32(24, sr, true); v.setUint32(28, sr * ch * 2, true);
  v.setUint16(32, ch * 2, true); v.setUint16(34, 16, true); str(36, 'data'); v.setUint32(40, len * ch * 2, true);
  const chans = []; for (let c = 0; c < ch; c++) chans.push(buffer.getChannelData(c));
  let o = 44;
  for (let i = 0; i < len; i++) for (let c = 0; c < ch; c++) { const x = Math.max(-1, Math.min(1, chans[c][i])); v.setInt16(o, x < 0 ? x * 32768 : x * 32767, true); o += 2; }
  return new Blob([out], { type: 'audio/wav' });
}

async function renderOffline(p, count, sampleRate = 48000) {
  const seconds = p.burn * 1.1 + 3 + (count - 1) * 2;
  const off = new OfflineAudioContext(2, Math.floor(sampleRate * seconds), sampleRate);
  const scene = buildScene(off, p, null);
  for (let i = 0; i < count; i++) scene.light(0.3 + i * 2, count === 1 ? 0 : (i / (count - 1)) * 1.4 - 0.7);
  scene.schedule(0, seconds);
  return off.startRendering();
}

// ---------- 界面 ----------
const $ = s => document.querySelector(s);
const logEl = $('#log');
function log(msg) { const lines = logEl.textContent.split('\n').filter(Boolean); lines.unshift(msg); logEl.textContent = lines.slice(0, 6).join('\n'); }
for (const id of ['density', 'burstiness', 'force', 'depth', 'burn']) {
  const el = $('#' + id), out = document.querySelector(`output[for=${id}]`);
  const show = () => out.textContent = id === 'burn' ? el.value : Number(el.value).toFixed(2);
  el.addEventListener('input', () => { P[id] = Number(el.value); show(); }); show();
}
$('#seed').addEventListener('change', e => { P.seed = e.target.value || 'spark'; log('种子已改，重新开始后生效'); });

let live = null, timer = null, raf = null;
const flashes = [];   // 最近的火花，画在画布上
function onSpark(ev) { if (flashes.length > 600) flashes.splice(0, 200); flashes.push({ at: ev.at, x: 0.5 + ev.sp.pan * 0.6, amp: ev.amp, big: ev.big, ang: Math.random() * 6.28, len: 8 + Math.random() * 40 * (ev.big ? 2 : 1), id: ev.sp.id }); }

async function start() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();
  live = buildScene(ctx, P, onSpark);
  live.state.until = ctx.currentTime + 0.05;
  timer = setInterval(() => { const to = ctx.currentTime + 1.5; if (to > live.state.until) { live.schedule(live.state.until, to); live.state.until = to; } }, 200);
  $('#toggle').textContent = '停止'; log(`开始：种子 "${P.seed}"`); draw();
}
function stop() {
  clearInterval(timer); cancelAnimationFrame(raf);
  live.master.gain.setTargetAtTime(0, live.ctx.currentTime, 0.2);
  const c = live.ctx; setTimeout(() => c.close(), 800); live = null; flashes.length = 0;
  $('#toggle').textContent = '开始'; log('停止');
}
function lightOne() {
  if (!live) return;
  const sp = live.light(live.ctx.currentTime + 0.05);
  live.scheduleSparkler(sp, live.state.until);   // 补上当前窗口里已经该发生的火花
  log(`点燃第 ${sp.id} 根，约 ${sp.dur.toFixed(0)} 秒`);
}
$('#toggle').addEventListener('click', () => live ? stop() : start());
$('#light').addEventListener('click', lightOne);
$('#out').addEventListener('click', () => { if (live) { for (const sp of live.state.sparklers) sp.dur = Math.min(sp.dur, live.ctx.currentTime - sp.t0 + 2.5); log('全部快速熄灭'); } });
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.code === 'Space') { e.preventDefault(); lightOne(); } });

const canvas = $('#sky'), g = canvas.getContext('2d');
function draw() {
  if (!live) return;
  const now = live.ctx.currentTime, W = canvas.width, H = canvas.height;
  g.fillStyle = 'rgba(6,10,18,0.35)'; g.fillRect(0, 0, W, H);
  for (const sp of live.state.sparklers) {
    const I = intensity(sp, now); if (I <= 0) continue;
    const x = (0.5 + sp.pan * 0.6) * W, y = H * 0.55;
    g.strokeStyle = '#c9b48a'; g.lineWidth = 3; g.beginPath(); g.moveTo(x, H); g.lineTo(x, y); g.stroke();
    const glow = g.createRadialGradient(x, y, 0, x, y, 40 + 60 * I);
    glow.addColorStop(0, `rgba(255,240,200,${0.9 * I})`); glow.addColorStop(1, 'rgba(255,200,120,0)');
    g.fillStyle = glow; g.beginPath(); g.arc(x, y, 40 + 60 * I, 0, 6.28); g.fill();
  }
  for (const f of flashes) {
    const age = now - f.at; if (age < 0 || age > 0.18) continue;
    const a = 1 - age / 0.18, x = f.x * W, y = canvas.height * 0.55;
    g.strokeStyle = f.big ? `rgba(255,255,255,${a})` : `rgba(255,220,150,${a * Math.min(1, f.amp * 4)})`;
    g.lineWidth = f.big ? 2 : 1; g.beginPath(); g.moveTo(x, y);
    g.lineTo(x + Math.cos(f.ang) * f.len * (1 + age * 8), y + Math.sin(f.ang) * f.len * (1 + age * 8)); g.stroke();
  }
  raf = requestAnimationFrame(draw);
}

$('#export').addEventListener('click', async () => {
  const btn = $('#export'), count = Math.min(6, Math.max(1, Number($('#count').value) || 1));
  btn.disabled = true; btn.textContent = '渲染中…';
  try {
    const buf = await renderOffline({ ...P }, count);
    const url = URL.createObjectURL(encodeWav(buf));
    const a = document.createElement('a'); a.href = url; a.download = `sparkler-${P.seed}-x${count}.wav`; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000); log(`已导出 ${count} 根`);
  } catch (e) { log('导出失败：' + e.message); }
  finally { btn.disabled = false; btn.textContent = '导出 WAV（一根烧完的全过程）'; }
});
window.Sparkler = { P, buildScene, renderOffline, encodeWav, intensity };
</script>
</body>
</html>
